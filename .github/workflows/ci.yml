name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

# The README claims this site has "a custom verification pipeline that blocks
# the build on regression". Until now that pipeline only ran when someone
# remembered to type ./tools/verificar.sh, which makes the claim a promise
# rather than a fact. This job is the difference between the two.
#
# Step 7 compares the vendored library demos against the originals in
# ../framebudget and ../glaze. It used to skip here, because the siblings are
# separate repositories and were not checked out — "nada a comparar", by
# design, the same thing it does on the Cloudflare builder.
#
# That design had a hole, and it opened. Both libraries were changed this week
# and neither vendored copy was re-synced, so /framebudget/ and /glaze/ went
# live running last week's code. The only guard was a step that silently
# skipped everywhere except one laptop, on the one command nobody had run.
#
# So the siblings are checked out now and step 7 does its job on every push.
# This is the whole repository in one lesson: a check that can quietly decline
# to run is not a check.

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio
    steps:
      # Into a subdirectory, so the sibling repositories can sit beside it
      # exactly as they do on a development machine. actions/checkout refuses
      # to write outside the workspace, so `path: ../framebudget` is not an
      # option; this layout is.
      - uses: actions/checkout@v7
        with:
          path: portfolio

      - uses: actions/checkout@v7
        with:
          repository: eimaieros/framebudget
          path: framebudget

      - uses: actions/checkout@v7
        with:
          repository: eimaieros/glaze
          path: glaze

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The harness runs the page in jsdom. NODE_PATH is how verificar.sh
      # finds it — the script exports /tmp/node_modules, so install there.
      - name: Install jsdom
        run: |
          mkdir -p /tmp
          npm install --prefix /tmp --no-audit --no-fund --silent jsdom

      # auditoria.py and check-tdz.py use only the standard library. The
      # PIL/numpy tools in tools/ generate imagery and are not part of
      # verification, so nothing extra is installed for them.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Eight checks, in order
        run: ./tools/verificar.sh

      # verificar.sh already builds dist/ as its last step. Publishing it lets
      # you download exactly what Cloudflare would serve and diff it against
      # what is live, which is the fastest way to answer "is the thing at the
      # address the thing in the repository?"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dist
          path: portfolio/dist/
          retention-days: 7

  # ── the number the README used to claim ────────────────────────────────────
  #
  # The README said "the target here is >= 90" for as long as the site existed.
  # The first run of this job scored 0.57, and PageSpeed Insights against the
  # live site agreed exactly, so it was the site and not the runner. The claim
  # is corrected now and the assertions are a ratchet — see lighthouserc.json.
  #
  # Only index.html is audited. staticDistDir would otherwise crawl every HTML
  # file in dist/, which includes the vendored framebudget demo — a page whose
  # entire purpose is to jam the main thread so you can watch the library
  # degrade. Scoring its performance measures the demo doing its job.
  #
  # Three runs and the median, because a single Lighthouse run on a shared
  # runner is noisy enough to fail for reasons unrelated to the site.
  lighthouse:
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # dist/ is generated, not committed, so it has to be built here too. Ten
      # seconds, and it keeps the two jobs independent.
      - name: Build dist/
        run: ./tools/build.sh

      # artifactName is not decoration. The action hardcodes its results
      # directory to $PWD/.lighthouseci and uploads it under a name that
      # defaults to "lighthouse-results" — so running the action twice in one
      # job made the second upload collide with the first, and GitHub answers
      # a duplicate artifact name with a non-retryable 409. The mobile step
      # collected fine and asserted fine and then failed on the way out.
      #
      # Keep the full JSON, not just the pass/fail. Working out *why* the score
      # is what it is meant asking PageSpeed Insights, and its free quota ran
      # out mid-investigation — so the diagnosis stalled on somebody else's
      # rate limit. The report has mainthread-work-breakdown and bootup-time in
      # it; there is no reason to go and ask Google for numbers this job
      # already computed.
      - name: Lighthouse (desktop)
        id: desktop
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          artifactName: lighthouse-desktop
          temporaryPublicStorage: true

      # Read the number before the next step overwrites it. `lhci collect`
      # empties .lighthouseci on the way in, and both runs use that same
      # directory, so the desktop report exists only in this gap.
      - name: Desktop, in the log
        if: always()
        run: node tools/resumo-lighthouse.mjs "${{ steps.desktop.outputs.resultsPath }}" "Desktop"

      # ── mobile ────────────────────────────────────────────────────────────
      #
      # CLAUDE.md says a working mobile experience is not optional. Nothing was
      # measuring it: every Lighthouse run so far has been desktop, and the
      # mobile preset adds a 4x CPU slowdown on top of everything that already
      # costs this site its score. The number is unknown, which for a site that
      # is somebody's work sample is the wrong thing for it to be.
      #
      # The performance floor is a ratchet recorded in the sibling config.
      # There is no `preset` here — mobile is what Lighthouse does by default.
      # See lighthouserc.mobile.json.
      - name: Lighthouse (mobile)
        id: mobile
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.mobile.json
          uploadArtifacts: true
          artifactName: lighthouse-mobile
          temporaryPublicStorage: true

      - name: Mobile, in the log
        if: always()
        run: node tools/resumo-lighthouse.mjs "${{ steps.mobile.outputs.resultsPath }}" "Mobile"
